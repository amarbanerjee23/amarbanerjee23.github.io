<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="t"><title id="t">Innovation in Academia</title><defs><linearGradient id="g" x1="0" x2="1" y2="1"><stop stop-color="#061b31"/><stop offset="1" stop-color="#07516a"/></linearGradient><style>.s{font-family:Manrope,Arial,sans-serif}.ser{font-family:Georgia,serif}.h{font-size:30px;font-weight:800;fill:#082a43}.m{fill:#456476}.b{font-weight:800}</style></defs><rect width="1000" height="1414" fill="#f8fbfd"/><path d="M0 0h1000v585C775 520 635 640 0 526Z" fill="url(#g)"/><text x="60" y="80" class="s" font-size="18" letter-spacing="2" fill="#f6c65b">ACADEMIC EXCELLENCE · INNOVATE · RESEARCH · IMPACT</text><text x="60" y="198" class="ser" font-size="86" fill="white">Innovation</text><text x="60" y="290" class="ser" font-size="82" fill="#22c0d8">in Academia</text><rect x="60" y="330" width="350" height="5" rx="3" fill="#f6c65b"/><text x="60" y="385" class="s" font-size="24" fill="white"><tspan x="60">Helping students move from technical capability</tspan><tspan x="60" dy="36">to original thinking, stronger research and</tspan><tspan x="60" dy="36">visible innovation.</tspan></text><g transform="translate(760 240)"><circle r="122" fill="#f4fbff"/><circle r="72" fill="#ffd36b"/><path d="M-30 5c0-42 60-42 60 0 0 18-14 30-19 47H-11c-5-17-19-29-19-47Z" fill="#0b4961"/><path d="M-23-6 0-28 23-6 0 20Z" fill="none" stroke="white" stroke-width="5"/></g><g transform="translate(56 640)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">1. Why this matters</text><text x="32" y="98" class="s m" font-size="21"><tspan x="32">AI is changing the graduate advantage.</tspan><tspan x="32" dy="31">Students need to identify important problems,</tspan><tspan x="32" dy="31">frame strong questions and create meaningful</tspan><tspan x="32" dy="31">innovation.</tspan></text></g><g transform="translate(514 640)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">2. Program highlights</text><text x="32" y="100" class="s m" font-size="20"><tspan x="32">• Innovation thinking</tspan><tspan x="32" dy="29">• Research problem discovery</tspan><tspan x="32" dy="29">• Ground-breaking problem identification</tspan><tspan x="32" dy="29">• Future-ready differentiation</tspan></text></g><g transform="translate(56 870)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">3. Outcomes</text><text x="32" y="100" class="s m" font-size="20"><tspan x="32">• Stronger problem framing</tspan><tspan x="32" dy="29">• Higher-quality research directions</tspan><tspan x="32" dy="29">• Innovation mindset</tspan><tspan x="32" dy="29">• Institutional differentiation</tspan></text></g><g transform="translate(514 870)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">4. Formats</text><text x="32" y="106" class="s m" font-size="22"><tspan x="32">Keynote · Workshop</tspan><tspan x="32" dy="34">Multi-session cohort program</tspan></text></g><rect x="56" y="1100" width="888" height="118" rx="24" fill="#eaf6f8"/><text x="86" y="1148" class="h s">5. Ideal for</text><text x="86" y="1187" class="s m" font-size="22">Universities · engineering colleges · research-focused institutes</text><rect y="1256" width="1000" height="158" fill="#061b31"/><text x="500" y="1320" class="s b" text-anchor="middle" font-size="35" fill="#f6c65b">ACADEMIC INNOVATION PROGRAM</text><text x="500" y="1366" class="s" text-anchor="middle" font-size="27" fill="#22c0d8">PILOT WITH ONE COHORT · PROVE VALUE · SCALE WHAT WORKS</text></svg>