<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="t"><title id="t">Connecting Technology to Emotions</title><defs><linearGradient id="g"><stop stop-color="#061b31"/><stop offset="1" stop-color="#07516a"/></linearGradient><style>.s{font-family:Manrope,Arial,sans-serif}.ser{font-family:Georgia,serif}.h{font-size:30px;font-weight:800;fill:#082a43}.m{fill:#456476}.b{font-weight:800}</style></defs><rect width="1000" height="1414" fill="#f8fbfd"/><path d="M0 0h1000v590C760 530 615 650 0 535Z" fill="url(#g)"/><text x="60" y="78" class="s" font-size="18" letter-spacing="2" fill="#f6c65b">HUMAN-CENTERED TECHNOLOGY · EMPATHY · RESPONSIBLE AI</text><text x="60" y="177" class="ser" font-size="68" fill="white">Connecting</text><text x="60" y="262" class="ser" font-size="80" fill="#22c0d8">Technology</text><text x="60" y="345" class="ser" font-size="68" fill="white">to Emotions</text><rect x="60" y="382" width="350" height="5" fill="#f6c65b"/><text x="60" y="438" class="s" font-size="24" fill="white"><tspan x="60">Helping students design technology with empathy,</tspan><tspan x="60" dy="36">human understanding and responsible innovation.</tspan></text><g transform="translate(770 235)"><circle r="120" fill="#f4fbff"/><path d="M0 70C-112-8-75-82-24-56 0-43 0-20 0-20s0-23 24-36c51-26 88 48-24 126Z" fill="#ffd36b"/><circle r="26" fill="#0b4961"/><g stroke="#fff" stroke-width="4" fill="none"><path d="M0 0-42-25M0 0 42-25M0 0 0 44"/><circle cx="-42" cy="-25" r="8"/><circle cx="42" cy="-25" r="8"/><circle cy="44" r="8"/></g></g><g transform="translate(56 640)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">1. Why this matters</text><text x="32" y="98" class="s m" font-size="21"><tspan x="32">Technology succeeds when it connects with</tspan><tspan x="32" dy="31">human needs, emotions, trust and lived</tspan><tspan x="32" dy="31">experience.</tspan></text></g><g transform="translate(514 640)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">2. Program highlights</text><text x="32" y="100" class="s m" font-size="20"><tspan x="32">• Human-centered thinking</tspan><tspan x="32" dy="29">• Empathy in design</tspan><tspan x="32" dy="29">• Responsible AI awareness</tspan><tspan x="32" dy="29">• Meaningful problem solving</tspan></text></g><g transform="translate(56 870)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">3. Outcomes</text><text x="32" y="100" class="s m" font-size="20"><tspan x="32">• Better user understanding</tspan><tspan x="32" dy="29">• More relevant innovation</tspan><tspan x="32" dy="29">• Ethical sensitivity</tspan><tspan x="32" dy="29">• Stronger interdisciplinary thinking</tspan></text></g><g transform="translate(514 870)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">4. Formats</text><text x="32" y="108" class="s m" font-size="22"><tspan x="32">Keynote · Workshop</tspan><tspan x="32" dy="34">Multi-session cohort program</tspan></text></g><rect x="56" y="1100" width="888" height="118" rx="24" fill="#eaf6f8"/><text x="86" y="1148" class="h s">5. Ideal for</text><text x="86" y="1187" class="s m" font-size="22">Engineering · design · healthcare · interdisciplinary cohorts</text><rect y="1256" width="1000" height="158" fill="#061b31"/><text x="500" y="1319" class="s b" text-anchor="middle" font-size="35" fill="#f6c65b">CONNECTING TECHNOLOGY TO EMOTIONS</text><text x="500" y="1366" class="s" text-anchor="middle" font-size="27" fill="#22c0d8">HUMAN-CENTERED TECHNOLOGY FOR REAL IMPACT</text></svg>