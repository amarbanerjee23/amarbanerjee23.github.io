<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="t"><title id="t">The Art of Storytelling in Education</title><defs><linearGradient id="g"><stop stop-color="#061b31"/><stop offset="1" stop-color="#084c68"/></linearGradient><style>.s{font-family:Manrope,Arial,sans-serif}.ser{font-family:Georgia,serif}.h{font-size:29px;font-weight:800;fill:#082a43}.m{fill:#456476}.b{font-weight:800}</style></defs><rect width="1000" height="1414" fill="#f8fbfd"/><path d="M0 0h1000v596C778 530 630 652 0 540Z" fill="url(#g)"/><text x="60" y="78" class="s" font-size="18" letter-spacing="2" fill="#f6c65b">NARRATIVE THINKING · RESEARCH STORY · COMMUNICATION · IMPACT</text><text x="60" y="170" class="ser" font-size="62" fill="white">The Art of</text><text x="60" y="260" class="ser" font-size="82" fill="#22c0d8">Storytelling</text><text x="60" y="344" class="ser" font-size="65" fill="white">in Education</text><rect x="60" y="382" width="350" height="5" fill="#f6c65b"/><text x="60" y="438" class="s" font-size="23" fill="white"><tspan x="60">Helping students turn ideas, projects and research</tspan><tspan x="60" dy="35">into narratives people remember, understand and act on.</tspan></text><g transform="translate(775 235)"><circle r="120" fill="#f4fbff"/><rect x="-55" y="-42" width="110" height="84" rx="18" fill="#22c0d8"/><path d="M-15 42-45 78-39 34Z" fill="#22c0d8"/><circle cx="-28" cy="-2" r="7" fill="white"/><circle cy="-2" r="7" fill="white"/><circle cx="28" cy="-2" r="7" fill="white"/><path d="M-65-82h74" stroke="#f6c65b" stroke-width="7" stroke-linecap="round"/><path d="M25-78h48M25-58h70" stroke="#0b4961" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(56 628)"><rect width="430" height="218" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="53" class="h s">1. Why storytelling matters</text><text x="32" y="94" class="s m" font-size="19"><tspan x="32">It helps students make meaning, explain complex</tspan><tspan x="32" dy="28">ideas, build memory, connect evidence and connect</tspan><tspan x="32" dy="28">knowledge to real life.</tspan></text></g><g transform="translate(514 628)"><rect width="430" height="218" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="53" class="h s">2. Beyond soft skills</text><text x="32" y="94" class="s m" font-size="18"><tspan x="32">Soft skills may cover speaking, etiquette or</tspan><tspan x="32" dy="27">confidence. Storytelling is different: it teaches</tspan><tspan x="32" dy="27">how to structure meaning, create connection,</tspan><tspan x="32" dy="27">frame evidence and move from information</tspan><tspan x="32" dy="27">to insight.</tspan></text></g><g transform="translate(56 872)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">3. Program highlights</text><text x="32" y="100" class="s m" font-size="20"><tspan x="32">• Narrative thinking</tspan><tspan x="32" dy="29">• Research storytelling</tspan><tspan x="32" dy="29">• Presentation + communication</tspan><tspan x="32" dy="29">• Story-led leadership communication</tspan></text></g><g transform="translate(514 872)"><rect width="430" height="202" rx="24" fill="white" stroke="#dbeaf0"/><text x="32" y="55" class="h s">4. Outcomes</text><text x="32" y="100" class="s m" font-size="20"><tspan x="32">• Better presentations</tspan><tspan x="32" dy="29">• Stronger project pitches</tspan><tspan x="32" dy="29">• Clearer research narratives</tspan><tspan x="32" dy="29">• More memorable communication</tspan></text></g><rect x="56" y="1102" width="888" height="118" rx="24" fill="#eaf6f8"/><text x="86" y="1148" class="h s">Formats + audience</text><text x="86" y="1187" class="s m" font-size="21">Keynote · Workshop · Story Lab cohort · students · researchers · innovation teams</text><rect y="1256" width="1000" height="158" fill="#061b31"/><text x="500" y="1318" class="s b" text-anchor="middle" font-size="35" fill="#f6c65b">BECAUSE IDEAS NEED STORIES</text><text x="500" y="1366" class="s" text-anchor="middle" font-size="28" fill="#22c0d8">TO CREATE UNDERSTANDING · MEMORY · ACTION · IMPACT</text></svg>