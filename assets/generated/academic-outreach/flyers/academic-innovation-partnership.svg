<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="t d"><title id="t">Academic Innovation Partnership</title><desc id="d">Institutional academic innovation flyer.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b31"/><stop offset="1" stop-color="#0b4360"/></linearGradient><style>.s{font-family:Manrope,Arial,sans-serif}.ser{font-family:Georgia,serif}.mut{fill:#466476}.body{font-size:24px}.small{font-size:18px;letter-spacing:2px}.h{font-size:31px;font-weight:800;fill:#082a43}.b{font-weight:800}</style></defs><rect width="1000" height="1414" fill="#f7fbfd"/><path d="M0 0h1000v585C840 525 700 610 512 600 310 590 156 555 0 492Z" fill="url(#g)"/><circle cx="813" cy="228" r="166" fill="#f4fbff"/><g fill="none" stroke="#19a9c6" stroke-width="3" opacity=".55"><path d="M620 92 720 158 830 92 914 178 850 278 738 270 664 356"/><circle cx="620" cy="92" r="8" fill="#19a9c6"/><circle cx="720" cy="158" r="8" fill="#19a9c6"/><circle cx="830" cy="92" r="8" fill="#19a9c6"/><circle cx="914" cy="178" r="8" fill="#19a9c6"/></g><text x="60" y="82" class="s small" fill="#f6c65b">ACADEMIC INNOVATION · RESEARCH · IMPACT</text><text x="60" y="190" class="ser" font-size="70" fill="white">Academic Innovation</text><text x="60" y="275" class="ser" font-size="76" fill="#22c0d8">Partnership</text><rect x="60" y="318" width="360" height="5" rx="3" fill="#f6c65b"/><text x="60" y="375" class="s body" fill="white"><tspan x="60">A low-risk pathway for institutions that want</tspan><tspan x="60" dy="36">students to move from technical execution to</tspan><tspan x="60" dy="36">problem discovery, stronger research and</tspan><tspan x="60" dy="36">visible innovation.</tspan></text><g transform="translate(738 168)"><circle r="74" fill="#ffd36b"/><path d="M-25 8c0-35 50-35 50 0 0 16-12 24-16 36H-9c-4-12-16-20-16-36Z" fill="#0c4160"/><rect x="-17" y="43" width="34" height="8" rx="4" fill="#0c4160"/><circle cx="-22" cy="-3" r="5" fill="#fff"/><circle cx="22" cy="-3" r="5" fill="#fff"/><path d="M-22-3 0-22 22-3 0 14Z" fill="none" stroke="#fff" stroke-width="4"/></g><g transform="translate(58 640)"><rect width="424" height="202" rx="24" fill="white" stroke="#dbeaf0"/><circle cx="58" cy="64" r="36" fill="#0d7f96"/><text x="58" y="74" class="s" text-anchor="middle" font-size="30" fill="white">01</text><text x="116" y="58" class="h s">Why this matters</text><text x="116" y="102" class="s mut" font-size="21"><tspan x="116">When technical knowledge becomes easier</tspan><tspan x="116" dy="31">to access, institutions need a stronger</tspan><tspan x="116" dy="31">differentiator: innovation capability.</tspan></text></g><g transform="translate(518 640)"><rect width="424" height="202" rx="24" fill="white" stroke="#dbeaf0"/><circle cx="58" cy="64" r="36" fill="#0d7f96"/><text x="58" y="74" class="s" text-anchor="middle" font-size="30" fill="white">02</text><text x="116" y="58" class="h s">Institution gets</text><text x="116" y="100" class="s mut" font-size="20"><tspan x="116">• Student differentiation</tspan><tspan x="116" dy="29">• Stronger research directions</tspan><tspan x="116" dy="29">• Innovation + IP awareness</tspan><tspan x="116" dy="29">• Visible institutional positioning</tspan></text></g><g transform="translate(58 870)"><rect width="424" height="202" rx="24" fill="white" stroke="#dbeaf0"/><circle cx="58" cy="64" r="36" fill="#0d7f96"/><text x="58" y="74" class="s" text-anchor="middle" font-size="30" fill="white">03</text><text x="116" y="58" class="h s">Pilot model</text><text x="116" y="100" class="s mut" font-size="20"><tspan x="116">• One cohort</tspan><tspan x="116" dy="29">• One measurable capability</tspan><tspan x="116" dy="29">• Leadership review</tspan><tspan x="116" dy="29">• Scale what works</tspan></text></g><g transform="translate(518 870)"><rect width="424" height="202" rx="24" fill="white" stroke="#dbeaf0"/><circle cx="58" cy="64" r="36" fill="#0d7f96"/><text x="58" y="74" class="s" text-anchor="middle" font-size="30" fill="white">04</text><text x="116" y="58" class="h s">Formats</text><text x="116" y="105" class="s mut" font-size="21"><tspan x="116">Diagnostic · pilot cohort</tspan><tspan x="116" dy="32">Multi-session institutional</tspan><tspan x="116" dy="32">capability program</tspan></text></g><rect x="58" y="1100" width="884" height="116" rx="24" fill="#eaf6f8"/><text x="88" y="1146" class="h s">Ideal for</text><text x="88" y="1185" class="s mut" font-size="22">Vice-Chancellors · Principals · Deans · HoDs · academic leaders</text><rect y="1254" width="1000" height="160" fill="#061b31"/><text x="500" y="1314" text-anchor="middle" class="s small" fill="#22c0d8">LOW-RISK FIRST STEP</text><text x="500" y="1367" text-anchor="middle" class="s b" font-size="35" fill="#f6c65b">REQUEST A 20-MINUTE INNOVATION DIAGNOSTIC</text></svg>