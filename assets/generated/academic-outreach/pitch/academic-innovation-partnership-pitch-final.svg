<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#061b31"/><stop offset="1" stop-color="#0a4e69"/></linearGradient></defs><rect width="1600" height="900" fill="#f7fbfd"/><rect width="1040" height="900" fill="url(#g)"/><text x="74" y="85" font-family="Arial" font-size="21" fill="#f6c65b">ACADEMIC INNOVATION FOR THE AI ERA</text><text x="74" y="195" font-family="Georgia" font-size="67" fill="white">What if your next differentiator</text><text x="74" y="273" font-family="Georgia" font-size="67" fill="white">is a cohort that learns to find</text><text x="74" y="351" font-family="Georgia" font-size="67" fill="#22c0d8">important problems?</text><text x="74" y="455" font-family="Arial" font-size="25" fill="#d7edf3">A pilot-ready institutional program connecting innovation, research, invention,</text><text x="74" y="493" font-family="Arial" font-size="25" fill="#d7edf3">future readiness and storytelling.</text><rect x="74" y="580" width="270" height="132" rx="24" fill="#0d3b51"/><text x="100" y="655" font-family="Arial" font-size="25" font-weight="700" fill="white">Innovation Thinking</text><rect x="365" y="580" width="270" height="132" rx="24" fill="#0d3b51"/><text x="391" y="655" font-family="Arial" font-size="25" font-weight="700" fill="white">Research Excellence</text><rect x="656" y="580" width="270" height="132" rx="24" fill="#0d3b51"/><text x="682" y="655" font-family="Arial" font-size="25" font-weight="700" fill="white">Patent Thinking</text><rect x="74" y="732" width="416" height="84" rx="22" fill="#e8f7fa"/><text x="282" y="784" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#082a43">Future Readiness</text><rect x="510" y="732" width="416" height="84" rx="22" fill="#e8f7fa"/><text x="718" y="784" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#082a43">Storytelling + Impact</text><rect x="1090" y="84" width="430" height="690" rx="38" fill="white"/><text x="1140" y="150" font-family="Arial" font-size="19" fill="#0b7f96">THE LOW-RISK START</text><text x="1140" y="230" font-family="Georgia" font-size="40" fill="#082a43">Choose one cohort.</text><text x="1140" y="290" font-family="Georgia" font-size="40" fill="#082a43">Define one capability.</text><text x="1140" y="385" font-family="Arial" font-size="25" fill="#456476">01 · Run the pilot.</text><text x="1140" y="435" font-family="Arial" font-size="25" fill="#456476">02 · Review the evidence.</text><text x="1140" y="485" font-family="Arial" font-size="25" fill="#456476">03 · Scale what works.</text><text x="1140" y="590" font-family="Arial" font-size="20" fill="#0b7f96">LEADERSHIP REVIEW</text><text x="1140" y="635" font-family="Arial" font-size="21" fill="#456476">Student outputs · research directions</text><text x="1140" y="668" font-family="Arial" font-size="21" fill="#456476">possible IP · owners · next decisions</text><text x="1140" y="725" font-family="Arial" font-size="23" font-weight="700" fill="#082a43">Dr Amar Banerjee</text><text x="74" y="865" font-family="Arial" font-size="20" fill="#d7edf3">amarbanerjee23@gmail.com · linkedin.com/in/amarbanerjee23</text></svg>