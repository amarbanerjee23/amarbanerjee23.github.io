<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>.s{font-family:Manrope,Arial,sans-serif}.ser{font-family:Georgia,serif}</style><rect width="1600" height="900" fill="#f7fbfd"/><rect width="520" height="900" fill="#061b31"/><text x="70" y="90" class="s" font-size="22" fill="#22c0d8">02 / 08 · THE AI SHIFT</text><text x="70" y="220" class="ser" font-size="62" fill="white"><tspan x="70">The AI Shift Is</tspan><tspan x="70" dy="72">Changing Graduate</tspan><tspan x="70" dy="72" fill="#22c0d8">Advantage</tspan></text><text x="70" y="510" class="s" font-size="25" fill="#d8edf2"><tspan x="70">Many technical tasks that once</tspan><tspan x="70" dy="38">created early-career advantage</tspan><tspan x="70" dy="38">can now be assisted by AI at scale.</tspan></text><g transform="translate(590 105)" class="s"><text x="0" y="0" font-size="23" fill="#0b7f96">WHAT AI AMPLIFIES</text><g transform="translate(0 45)"><rect width="430" height="170" rx="26" fill="white" stroke="#dbeaf0"/><text x="36" y="62" font-size="30" font-weight="800" fill="#082a43">Coding assistance</text><text x="36" y="108" font-size="22" fill="#456476">Routine implementation accelerates.</text></g><g transform="translate(470 45)"><rect width="430" height="170" rx="26" fill="white" stroke="#dbeaf0"/><text x="36" y="62" font-size="30" font-weight="800" fill="#082a43">Analysis</text><text x="36" y="108" font-size="22" fill="#456476">Patterns and summaries scale faster.</text></g><g transform="translate(0 255)"><rect width="430" height="170" rx="26" fill="white" stroke="#dbeaf0"/><text x="36" y="62" font-size="30" font-weight="800" fill="#082a43">Content generation</text><text x="36" y="108" font-size="22" fill="#456476">First drafts are less scarce.</text></g><g transform="translate(470 255)"><rect width="430" height="170" rx="26" fill="white" stroke="#dbeaf0"/><text x="36" y="62" font-size="30" font-weight="800" fill="#082a43">Research support</text><text x="36" y="108" font-size="22" fill="#456476">Discovery and synthesis accelerate.</text></g><rect x="0" y="470" width="900" height="170" rx="28" fill="#e8f7fa"/><text x="40" y="530" font-size="26" fill="#456476">Technical competence stays important, but no longer guarantees distinction.</text><text x="40" y="595" font-size="38" font-weight="800" fill="#082a43">The edge is shifting from knowing to <tspan fill="#0b9bb5">re-imagining.</tspan></text></g><rect y="800" width="1600" height="100" fill="#051728"/><text x="70" y="858" class="s" font-size="22" fill="#f6c65b">Innovation Thinking · Research Excellence · Patent Thinking · Future Readiness</text></svg>