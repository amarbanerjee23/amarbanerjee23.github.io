<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f7fbfd"/><rect width="1600" height="210" fill="#061b31"/><text x="80" y="78" font-family="Arial" font-size="22" fill="#22c0d8">04 / 08 · THE ACADEMIC CHALLENGE</text><text x="80" y="160" font-family="Georgia" font-size="62" fill="white">Research volume versus breakthrough visibility</text><rect x="90" y="280" width="660" height="430" rx="32" fill="white" stroke="#dbeaf0"/><text x="140" y="355" font-family="Arial" font-size="26" fill="#587482">VOLUME</text><text x="140" y="450" font-family="Arial" font-size="38" font-weight="700" fill="#082a43">High academic output</text><text x="140" y="510" font-family="Arial" font-size="24" fill="#456476">Valuable, but not sufficient by itself</text><text x="140" y="550" font-family="Arial" font-size="24" fill="#456476">to create institutional distinction.</text><rect x="850" y="280" width="660" height="430" rx="32" fill="#061b31"/><text x="900" y="355" font-family="Arial" font-size="26" fill="#22c0d8">VISIBLE IMPACT</text><circle cx="1180" cy="480" r="105" fill="none" stroke="#f6c65b" stroke-width="16"/><circle cx="1180" cy="480" r="58" fill="none" stroke="#22c0d8" stroke-width="16"/><circle cx="1180" cy="480" r="20" fill="#f6c65b"/><text x="800" y="795" text-anchor="middle" font-family="Arial" font-size="30" fill="#456476">The goal is not fewer papers. The goal is stronger questions, stronger contribution and stronger impact.</text></svg>