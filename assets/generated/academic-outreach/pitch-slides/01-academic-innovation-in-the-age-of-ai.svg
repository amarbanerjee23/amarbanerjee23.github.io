<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#061b31"/><stop offset="1" stop-color="#0a4e69"/></linearGradient><style>.s{font-family:Manrope,Arial,sans-serif}.ser{font-family:Georgia,serif}</style></defs><rect width="1600" height="900" fill="#f7fbfd"/><path d="M0 0h1050v900H0Z" fill="url(#g)"/><text x="80" y="92" class="s" font-size="22" letter-spacing="3" fill="#f6c65b">ACADEMIC INNOVATION FOR INDIAN INSTITUTES</text><text x="80" y="224" class="ser" font-size="72" fill="white">Why Academic Innovation</text><text x="80" y="310" class="ser" font-size="72" fill="#22c0d8">Matters in the Age of AI</text><text x="80" y="382" class="s" font-size="28" fill="#d7edf3"><tspan x="80">Technical knowledge remains essential. But in the era of AI,</tspan><tspan x="80" dy="42">innovation capability becomes the real differentiator.</tspan></text><g class="s" font-size="26" fill="white"><text x="110" y="505">01 · AI can perform many technical tasks at scale.</text><text x="110" y="570">02 · Knowledge alone is no longer the cutting edge.</text><text x="110" y="635">03 · Institutes need graduates who can imagine, question and innovate.</text></g><rect x="1110" y="110" width="410" height="560" rx="34" fill="white"/><text x="1160" y="180" class="s" font-size="20" letter-spacing="2" fill="#0b7f96">THE LOW-RISK START</text><text x="1160" y="260" class="ser" font-size="42" fill="#082a43"><tspan x="1160">Start with</tspan><tspan x="1160" dy="52">one cohort.</tspan></text><text x="1160" y="385" class="s" font-size="26" fill="#456476"><tspan x="1160">Prove value.</tspan><tspan x="1160" dy="40">Review evidence.</tspan><tspan x="1160" dy="40">Scale what works.</tspan></text><circle cx="1315" cy="570" r="64" fill="#ffd36b"/><path d="M1287 573c0-40 56-40 56 0 0 18-14 26-18 42h-20c-4-16-18-24-18-42Z" fill="#0b4961"/><rect y="760" width="1600" height="140" fill="#051728"/><text x="80" y="820" class="s" font-size="24" fill="#22c0d8">INNOVATION THINKING · RESEARCH EXCELLENCE · PATENT THINKING · FUTURE READINESS</text><text x="80" y="864" class="s" font-size="20" fill="#d7edf3">Dr Amar Banerjee · Innovation Leader · Researcher · Facilitator</text></svg>