<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#061b31"/><text x="82" y="88" font-family="Arial" font-size="22" fill="#22c0d8">06 / 08 · THE INDIAN OPPORTUNITY</text><text x="82" y="205" font-family="Georgia" font-size="70" fill="white">From technical excellence to</text><text x="82" y="290" font-family="Georgia" font-size="76" fill="#f6c65b">visible innovation capability.</text><text x="82" y="365" font-family="Arial" font-size="27" fill="#d7edf3">Indian institutes have strong talent. The opportunity is to make original thinking a repeatable academic capability.</text><g font-family="Arial"><rect x="82" y="450" width="330" height="210" rx="28" fill="#0b3850"/><text x="115" y="520" font-size="29" font-weight="700" fill="white">Original thinking</text><text x="115" y="568" font-size="22" fill="#d7edf3">Practise it deliberately.</text><rect x="445" y="450" width="330" height="210" rx="28" fill="#0b3850"/><text x="478" y="520" font-size="29" font-weight="700" fill="white">Important problems</text><text x="478" y="568" font-size="22" fill="#d7edf3">Learn to discover them.</text><rect x="808" y="450" width="330" height="210" rx="28" fill="#0b3850"/><text x="841" y="520" font-size="29" font-weight="700" fill="white">Research ambition</text><text x="841" y="568" font-size="22" fill="#d7edf3">Connect questions to evidence.</text><rect x="1171" y="450" width="330" height="210" rx="28" fill="#0b3850"/><text x="1204" y="520" font-size="29" font-weight="700" fill="white">Institutional identity</text><text x="1204" y="568" font-size="22" fill="#d7edf3">Make capability visible.</text></g><rect x="200" y="730" width="1200" height="92" rx="46" fill="#f7fbfd"/><text x="800" y="788" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#082a43">When knowledge is widely accessible, capability becomes the edge.</text></svg>