name: Organize frontend assets v2

on:
  push:
    branches: [main]
    paths:
      - '.asset-migration-v3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-frontend-assets-v2
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate verify and commit asset layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate and verify
        shell: bash
        run: |
          set -euo pipefail
          {
            python scripts/migrate-frontend-assets.py
            python scripts/fix-moved-js-urls.py
            python scripts/check-static-assets.py
            python scripts/check-asset-layout.py
            while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          } 2>&1 | tee /tmp/frontend-asset-migration-v2.log

      - name: Commit diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/frontend-asset-migration-v2.log asset-migration-diagnostics.txt || echo 'No diagnostic output captured.' > asset-migration-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-migration-diagnostics.txt
          git commit -m 'Record frontend asset migration diagnostics v2' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit organized layout
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f asset-migration-diagnostics.txt .asset-migration-v3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No migration changes required.'; exit 0; fi
          git commit -m 'Organize frontend assets into structured directories'
          git pull --rebase origin main
          git push origin HEAD:main
