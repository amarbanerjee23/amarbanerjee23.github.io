name: Apply academic trust conversion

on:
  push:
    branches: [trust-conversion-v1]
    paths:
      - 'assets/css/trust-conversion.css'
      - 'assets/js/trust-conversion.js'
      - 'scripts/apply-trust-conversion.py'
      - '.github/workflows/trust-conversion-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trust-conversion-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply academic trust conversion pass
        run: python scripts/apply-trust-conversion.py
      - name: Validate static references and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-static-assets.py
          python scripts/check-asset-layout.py
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workshops.html academic-partnerships.html facilitation-gallery.html research-ip.html profile.html privacy.html analytics-status.html assets/js/story-unfold.js assets/js/contact-intake.js
          if git diff --cached --quiet; then
            echo 'No additional source changes required.'
            exit 0
          fi
          git commit -m 'Apply academic trust and conversion source updates'
          git push origin HEAD:trust-conversion-v1
