name: Static site integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - 'assets/**'
      - 'downloads/**'
      - 'headshot.png'
      - 'scripts/check-static-assets.py'
      - '.github/workflows/static-site-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - 'assets/**'
      - 'downloads/**'
      - 'headshot.png'
      - 'scripts/check-static-assets.py'
      - '.github/workflows/static-site-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-reference-check:
    name: No missing local assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate HTML, CSS and JavaScript asset references
        run: python scripts/check-static-assets.py

      - name: Validate public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            script.js
            story-ui.js
            story-unfold.js
            academic-home.js
            academic-programs.js
            profile-page.js
            analytics-bootstrap.js
            analytics.js
            academic-engagement.js
            research-supplement.js
            gallery.js
            gallery-images.js
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done

      - name: Guard against passive vertical story-nav scrolling
        shell: python
        run: |
          from pathlib import Path
          for name in ('story-ui.js', 'academic-home.js', 'academic-programs.js'):
              text = Path(name).read_text(encoding='utf-8')
              if "block: 'nearest', inline: 'nearest'" in text or 'block:"nearest",inline:"nearest"' in text:
                  raise SystemExit(f'{name}: passive story navigation must not use scrollIntoView on both axes')
          print('Story navigation vertical-scroll guard: PASS')

  live-pages-smoke-check:
    name: Live GitHub Pages smoke check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: local-reference-check
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages propagation and verify critical resources
        shell: python
        run: |
          import time
          import urllib.request

          base = 'https://amarbanerjee23.github.io'
          paths = [
              '/',
              '/index.html',
              '/academic-future.css',
              '/academic-home.js',
              '/academic-programs.css',
              '/academic-programs.js',
              '/profile.html',
              '/profile-page.css',
              '/profile-page.js',
              '/story-ui-responsive.css',
              '/story-ui.css',
              '/story-ui.js',
              '/story-unfold.css',
              '/story-unfold.js',
              '/ux-calm-v2.css',
              '/sticky-nav-fix.css',
              '/script.js',
              '/analytics.js',
              '/analytics-config.js',
              '/academic-partnerships.html',
              '/academic-partnerships.css',
              '/academic-conversion.css',
              '/research-ip.html',
              '/workshops.html',
              '/facilitation-gallery.html',
              '/headshot.png',
              '/assets/ai-innovation-network.svg',
          ]

          def status(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Dr-Amar-Banerjee-site-integrity/1.0'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status

          failures = []
          for attempt in range(1, 7):
              failures = []
              for path in paths:
                  url = base + path
                  try:
                      code = status(url)
                      if code != 200:
                          failures.append((url, f'HTTP {code}'))
                  except Exception as error:
                      failures.append((url, str(error)))

              if not failures:
                  print(f'LIVE SITE INTEGRITY: PASS on attempt {attempt}')
                  break

              print(f'Attempt {attempt}/6: {len(failures)} resource(s) not ready yet.')
              if attempt < 6:
                  time.sleep(30)
          else:
              print('LIVE SITE INTEGRITY: FAIL')
              for url, error in failures:
                  print(f'- {url}: {error}')
              raise SystemExit(1)
