name: Static site integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'downloads/**'
      - 'scripts/check-static-assets.py'
      - 'scripts/check-asset-layout.py'
      - '.github/workflows/static-site-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'downloads/**'
      - 'scripts/check-static-assets.py'
      - 'scripts/check-asset-layout.py'
      - '.github/workflows/static-site-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-reference-check:
    name: No missing local assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate HTML, CSS and JavaScript asset references
        run: python scripts/check-static-assets.py

      - name: Validate frontend asset layout
        run: python scripts/check-asset-layout.py

      - name: Validate public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)

      - name: Guard against passive vertical story-nav scrolling
        shell: python
        run: |
          from pathlib import Path
          for name in (
              'assets/js/story-ui.js',
              'assets/js/academic-home.js',
              'assets/js/academic-programs.js',
          ):
              text = Path(name).read_text(encoding='utf-8')
              if "block: 'nearest', inline: 'nearest'" in text or 'block:"nearest",inline:"nearest"' in text:
                  raise SystemExit(f'{name}: passive story navigation must not use scrollIntoView on both axes')
          print('Story navigation vertical-scroll guard: PASS')

      - name: Verify all four brochure-backed academic programs
        shell: python
        run: |
          from pathlib import Path
          required = [
              'downloads/innovation-in-academia.pdf.b64',
              'downloads/modern-day-professional.pdf.b64',
              'downloads/technology-to-emotions.pdf.b64',
              'downloads/academic-innovation-partnership.pdf.b64',
          ]
          missing = [name for name in required if not Path(name).is_file() or Path(name).stat().st_size == 0]
          if missing:
              raise SystemExit('Missing or empty brochure assets: ' + ', '.join(missing))
          print('Four academic brochure assets: PASS')

  live-pages-smoke-check:
    name: Live GitHub Pages smoke check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: local-reference-check
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages propagation and verify critical resources
        shell: python
        run: |
          import time
          import urllib.request

          base = 'https://amarbanerjee23.github.io'
          paths = [
              '/',
              '/index.html',
              '/profile.html',
              '/academic-partnerships.html',
              '/research-ip.html',
              '/workshops.html',
              '/facilitation-gallery.html',
              '/assets/css/academic-future.css',
              '/assets/css/academic-programs.css',
              '/assets/css/academic-offerings.css',
              '/assets/css/contact-intake.css',
              '/assets/css/reading-comfort.css',
              '/assets/css/profile-page.css',
              '/assets/css/story-ui-responsive.css',
              '/assets/css/story-ui.css',
              '/assets/css/story-unfold.css',
              '/assets/css/ux-calm-v2.css',
              '/assets/css/sticky-nav-fix.css',
              '/assets/css/academic-partnerships.css',
              '/assets/css/academic-conversion.css',
              '/assets/js/academic-home.js',
              '/assets/js/academic-programs.js',
              '/assets/js/academic-offerings.js',
              '/assets/js/contact-intake.js',
              '/assets/js/profile-page.js',
              '/assets/js/story-ui.js',
              '/assets/js/story-unfold.js',
              '/assets/js/script.js',
              '/assets/js/analytics.js',
              '/assets/js/analytics-config.js',
              '/assets/media/portraits/headshot.png',
              '/assets/media/illustrations/ai-innovation-network.svg',
              '/assets/media/icons/favicon.svg',
              '/downloads/innovation-in-academia.pdf.b64',
              '/downloads/modern-day-professional.pdf.b64',
              '/downloads/technology-to-emotions.pdf.b64',
              '/downloads/academic-innovation-partnership.pdf.b64',
          ]

          def status(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Dr-Amar-Banerjee-site-integrity/1.0'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status

          failures = []
          for attempt in range(1, 7):
              failures = []
              for path in paths:
                  url = base + path
                  try:
                      code = status(url)
                      if code != 200:
                          failures.append((url, f'HTTP {code}'))
                  except Exception as error:
                      failures.append((url, str(error)))

              if not failures:
                  print(f'LIVE SITE INTEGRITY: PASS on attempt {attempt}')
                  break

              print(f'Attempt {attempt}/6: {len(failures)} resource(s) not ready yet.')
              if attempt < 6:
                  time.sleep(30)
          else:
              print('LIVE SITE INTEGRITY: FAIL')
              for url, error in failures:
                  print(f'- {url}: {error}')
              raise SystemExit(1)
