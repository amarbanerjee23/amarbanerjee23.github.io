name: Export public-safe analytics summary

on:
  push:
    branches: [main]
    paths:
      - 'analytics/last-health-check.json'
      - 'assets/js/analytics-config.js'
      - '.github/workflows/export-analytics-summary.yml'
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployed analytics endpoint
        id: endpoint
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path('assets/js/analytics-config.js').read_text(encoding='utf-8')
          match = re.search(r"endpoint:\s*['\"]([^'\"]*)['\"]", text)
          endpoint = (match.group(1).strip() if match else '')
          if endpoint.endswith('/collect'):
              base = endpoint[:-len('/collect')]
          else:
              base = endpoint.rstrip('/')
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"configured={'true' if base else 'false'}\n")
              handle.write(f"base={base}\n")
          if not base:
              print('Analytics endpoint is not activated yet; leaving summary files unchanged.')

      - name: Fetch 30-day public-safe aggregate summary
        if: steps.endpoint.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analytics
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            "${{ steps.endpoint.outputs.base }}/summary.json?days=30" \
            --output analytics/summary.json

      - name: Validate aggregate response
        if: steps.endpoint.outputs.configured == 'true'
        shell: python
        run: |
          import json
          from pathlib import Path
          data=json.loads(Path('analytics/summary.json').read_text())
          assert isinstance(data.get('headline'), dict)
          assert all(key in data['headline'] for key in ('visitors','sessions','events'))
          assert 'aggregate-public-safe' in data.get('privacy','')

      - name: Create simple CSV summary
        if: steps.endpoint.outputs.configured == 'true'
        shell: python
        run: |
          import csv, json
          from pathlib import Path

          path = Path('analytics/summary.json')
          data = json.loads(path.read_text())
          rows = []
          rows.append(['meta', 'generated_at', data.get('generated_at', '')])
          rows.append(['meta', 'window_days', data.get('window_days', '')])
          rows.append(['meta', 'privacy', data.get('privacy', '')])
          for key, value in data.get('headline', {}).items():
              rows.append(['headline', key, value])
          for section in ['top_pages', 'countries', 'cities', 'referrers', 'events']:
              for item in data.get(section, []):
                  rows.append([section, item.get('label', ''), item.get('count', 0)])

          with Path('analytics/summary.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.writer(handle)
              writer.writerow(['category', 'label', 'count_or_value'])
              writer.writerows(rows)

      - name: Commit updated aggregate summary
        if: steps.endpoint.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/summary.json analytics/summary.csv
          if git diff --cached --quiet; then
            echo "No analytics summary changes."
          else
            git commit -m "Update privacy-safe website analytics summary [skip ci]"
            git push
          fi
