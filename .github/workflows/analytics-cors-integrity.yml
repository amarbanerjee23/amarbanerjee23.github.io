name: Analytics CORS integrity

on:
  push:
    branches: [main]
    paths:
      - 'analytics.js'
      - 'analytics-config.js'
      - 'analytics-worker/**'
      - 'scripts/check-analytics-cors-contract.py'
      - '.github/workflows/analytics-cors-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analytics.js'
      - 'analytics-config.js'
      - 'analytics-worker/**'
      - 'scripts/check-analytics-cors-contract.py'
      - '.github/workflows/analytics-cors-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    name: Browser and Worker CORS contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate analytics CORS source contract
        run: python scripts/check-analytics-cors-contract.py

  live-worker:
    name: Live Worker credentialed preflight compatibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Cloudflare deployment and verify CORS end to end
        shell: python
        run: |
          import datetime
          import json
          import time
          import urllib.request
          from pathlib import Path

          origin = 'https://amarbanerjee23.github.io'
          base = 'https://amarbanerjee23-github-io.amarbanerjee23.workers.dev'
          collect = base + '/collect'

          def request(url, method='GET', headers=None, data=None):
              req = urllib.request.Request(url, method=method, headers=headers or {}, data=data)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, {k.lower(): v for k, v in response.headers.items()}, response.read()

          errors = []
          for attempt in range(1, 10):
              errors = []
              try:
                  status, headers, _ = request(
                      collect,
                      method='OPTIONS',
                      headers={
                          'Origin': origin,
                          'Access-Control-Request-Method': 'POST',
                          'Access-Control-Request-Headers': 'content-type',
                          'User-Agent': 'Dr-Amar-Banerjee-CORS-integrity/1.0',
                      },
                  )
                  if status != 204:
                      errors.append(f'preflight status was {status}, expected 204')
                  if headers.get('access-control-allow-origin') != origin:
                      errors.append('Access-Control-Allow-Origin is missing or incorrect')
                  if headers.get('access-control-allow-credentials', '').lower() != 'true':
                      errors.append('Access-Control-Allow-Credentials must be true for cached credentialed clients')
                  if 'post' not in headers.get('access-control-allow-methods', '').lower():
                      errors.append('POST is missing from Access-Control-Allow-Methods')
                  if 'content-type' not in headers.get('access-control-allow-headers', '').lower():
                      errors.append('Content-Type is missing from Access-Control-Allow-Headers')
              except Exception as exc:
                  errors.append(f'preflight request failed: {exc}')

              try:
                  payload = json.dumps({
                      'event_type': 'page_view',
                      'visitor_id': 'cors-integrity-probe',
                      'session_id': 'cors-integrity-probe',
                      'page': '/analytics-cors-integrity',
                      'title': 'CORS integrity probe',
                      'dry_run': True,
                  }).encode('utf-8')
                  status, headers, body = request(
                      collect,
                      method='POST',
                      headers={
                          'Origin': origin,
                          'Content-Type': 'application/json',
                          'User-Agent': 'Dr-Amar-Banerjee-CORS-integrity/1.0',
                      },
                      data=payload,
                  )
                  data = json.loads(body.decode('utf-8'))
                  if status != 202 or data.get('ok') is not True or data.get('dry_run') is not True:
                      errors.append(f'dry-run collect response unexpected: HTTP {status} {data}')
                  if headers.get('access-control-allow-origin') != origin:
                      errors.append('POST response Access-Control-Allow-Origin is missing or incorrect')
                  if headers.get('access-control-allow-credentials', '').lower() != 'true':
                      errors.append('POST response Access-Control-Allow-Credentials is missing')
              except Exception as exc:
                  errors.append(f'dry-run POST failed: {exc}')

              if not errors:
                  report = {
                      'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'overall': 'pass',
                      'origin': origin,
                      'endpoint': collect,
                      'checks': {
                          'preflight_http_204': 'success',
                          'allow_origin_exact_match': 'success',
                          'allow_credentials_true': 'success',
                          'allow_post_method': 'success',
                          'allow_content_type_header': 'success',
                          'dry_run_post': 'success',
                      },
                      'note': 'Credentialed-preflight compatibility is retained for older cached clients; current analytics.js sends with credentials omitted.'
                  }
                  Path('analytics/cors-health-check.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
                  print(f'ANALYTICS CORS LIVE CHECK: PASS on attempt {attempt}')
                  break

              print(f'Attempt {attempt}/9 not ready:')
              for error in errors:
                  print(f'- {error}')
              if attempt < 9:
                  time.sleep(20)
          else:
              raise SystemExit('ANALYTICS CORS LIVE CHECK: FAIL after deployment retry window')

      - name: Commit live CORS verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/cors-health-check.json
          if git diff --cached --quiet; then
            echo "CORS health report is unchanged."
          else
            git commit -m "Update live analytics CORS report [skip ci]"
            git push
          fi
