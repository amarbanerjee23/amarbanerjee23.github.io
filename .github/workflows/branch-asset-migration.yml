name: Branch asset migration

on:
  push:
    branches: [asset-segregation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-asset-segregation
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'asset-segregation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/migrate-frontend-assets.py
          python scripts/check-static-assets.py
          python scripts/check-asset-layout.py
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f asset-migration-diagnostics.txt .asset-migration-v3 .asset-migration-branch-trigger .github/asset-migration-trigger.txt
          rm -f .github/workflows/organize-frontend-assets.yml .github/workflows/organize-frontend-assets-v2.yml .github/workflows/organize-frontend-assets-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No migration changes required.'; exit 0; fi
          git commit -m 'Organize frontend assets into structured directories'
          git push origin HEAD:asset-segregation
