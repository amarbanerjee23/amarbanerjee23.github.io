name: Organize frontend assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-frontend-assets.py'
      - 'scripts/fix-moved-js-urls.py'
      - '.github/asset-migration-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-frontend-assets
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and verify asset layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate and verify frontend assets
        shell: bash
        run: |
          set -euo pipefail
          {
            python scripts/migrate-frontend-assets.py
            python scripts/fix-moved-js-urls.py
            python scripts/check-static-assets.py
            python scripts/check-asset-layout.py
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          } 2>&1 | tee /tmp/frontend-asset-migration.log

      - name: Commit migration diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/frontend-asset-migration.log asset-migration-diagnostics.txt || echo 'Migration failed before diagnostics were captured.' > asset-migration-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-migration-diagnostics.txt
          git commit -m 'Record frontend asset migration diagnostics' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit migration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f asset-migration-diagnostics.txt
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No asset migration changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Organize frontend assets into structured directories'
          git pull --rebase origin main
          git push origin HEAD:main
