name: Organize frontend assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-frontend-assets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-frontend-assets
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and verify asset layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Organize frontend assets
        run: python scripts/migrate-frontend-assets.py

      - name: Validate static references
        run: python scripts/check-static-assets.py

      - name: Validate asset layout
        run: python scripts/check-asset-layout.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No asset migration changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Organize frontend assets into structured directories'
          git pull --rebase origin main
          git push origin HEAD:main
