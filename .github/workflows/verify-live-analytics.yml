name: Verify live website analytics

# Visitor activity is stored in D1 and must never write back to GitHub. This
# workflow only verifies the live Worker. It runs after analytics code changes,
# once per day, or when manually requested.
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/analytics-config.js'
      - 'analytics-worker/**'
      - '.github/workflows/verify-live-analytics.yml'
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-analytics-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve collector endpoint
        id: endpoint
        shell: python
        run: |
          import os, re
          from pathlib import Path
          text = Path('assets/js/analytics-config.js').read_text(encoding='utf-8')
          match = re.search(r"endpoint:\s*['\"]([^'\"]+)['\"]", text)
          if not match:
              raise SystemExit('assets/js/analytics-config.js has no collector endpoint')
          endpoint = match.group(1).rstrip('/')
          if not endpoint.endswith('/collect'):
              raise SystemExit('analytics endpoint must end in /collect')
          base = endpoint[:-len('/collect')]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'endpoint={endpoint}\n')
              handle.write(f'base={base}\n')

      - name: Verify D1-backed Worker health and browser read CORS
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.endpoint.outputs.base }}'
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/health.json -D /tmp/health.headers -w '%{http_code}' --max-time 15 \
              -H 'Origin: https://amarbanerjee23.github.io' "$base/health" || true)
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True
          assert data.get('database') is True
          PY
            then
              tr -d '\r' < /tmp/health.headers | grep -i '^Access-Control-Allow-Origin: https://amarbanerjee23.github.io$'
              cat /tmp/health.json
              exit 0
            fi
            echo "Health not ready yet (attempt $attempt/12, HTTP $code). Waiting 10s..."
            sleep 10
          done
          echo 'Cloudflare Worker did not become D1-healthy with browser-readable CORS within two minutes.' >&2
          [ -f /tmp/health.json ] && cat /tmp/health.json >&2 || true
          exit 1

      - name: Verify public-safe summary endpoint and browser read CORS
        id: summary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Origin: https://amarbanerjee23.github.io' \
            -D /tmp/summary.headers \
            '${{ steps.endpoint.outputs.base }}/summary.json?days=30' -o /tmp/summary.json
          tr -d '\r' < /tmp/summary.headers | grep -i '^Access-Control-Allow-Origin: https://amarbanerjee23.github.io$'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/summary.json'))
          assert isinstance(data.get('headline'), dict)
          for key in ('visitors','sessions','events'):
              assert key in data['headline']
          assert 'aggregate-public-safe' in data.get('privacy','')
          print(json.dumps(data, indent=2))
          PY

      - name: Verify browser CORS preflight
        id: cors
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/options.body -D /tmp/options.headers -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://amarbanerjee23.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type' \
            '${{ steps.endpoint.outputs.endpoint }}')
          test "$status" = '204'
          tr -d '\r' < /tmp/options.headers | grep -i '^Access-Control-Allow-Origin: https://amarbanerjee23.github.io$'
          tr -d '\r' < /tmp/options.headers | grep -i '^Access-Control-Allow-Methods:.*POST'

      - name: Verify collection path without writing a synthetic visit
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/collect.json -w '%{http_code}' -X POST \
            -H 'Origin: https://amarbanerjee23.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"event_type":"page_view","visitor_id":"00000000-0000-4000-8000-000000000001","session_id":"00000000-0000-4000-8000-000000000002","page":"/__analytics_health_check__","title":"Analytics health check","dry_run":true}' \
            '${{ steps.endpoint.outputs.endpoint }}')
          test "$status" = '202'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/collect.json'))
          assert data.get('ok') is True
          assert data.get('dry_run') is True
          assert data.get('database') is True
          print(json.dumps(data, indent=2))
          PY

      - name: Fail verification when any live check failed
        if: always()
        shell: bash
        run: |
          test '${{ steps.health.outcome }}' = 'success'
          test '${{ steps.summary.outcome }}' = 'success'
          test '${{ steps.cors.outcome }}' = 'success'
          test '${{ steps.collect.outcome }}' = 'success'
