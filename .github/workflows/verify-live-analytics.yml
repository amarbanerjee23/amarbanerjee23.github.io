name: Verify live website analytics

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/analytics-config.js'
      - 'analytics-worker/**'
      - '.github/workflows/verify-live-analytics.yml'
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-analytics-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve collector endpoint
        id: endpoint
        shell: python
        run: |
          import os, re
          from pathlib import Path
          text = Path('assets/js/analytics-config.js').read_text(encoding='utf-8')
          match = re.search(r"endpoint:\s*['\"]([^'\"]+)['\"]", text)
          if not match:
              raise SystemExit('assets/js/analytics-config.js has no collector endpoint')
          endpoint = match.group(1).rstrip('/')
          if not endpoint.endswith('/collect'):
              raise SystemExit('analytics endpoint must end in /collect')
          base = endpoint[:-len('/collect')]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'endpoint={endpoint}\n')
              handle.write(f'base={base}\n')

      - name: Wait for Cloudflare production deployment and verify D1-backed health
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.endpoint.outputs.base }}'
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$base/health" || true)
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True
          assert data.get('database') is True
          PY
            then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health not ready yet (attempt $attempt/36, HTTP $code). Waiting 10s..."
            sleep 10
          done
          echo 'Cloudflare Worker did not become D1-healthy within six minutes.' >&2
          [ -f /tmp/health.json ] && cat /tmp/health.json >&2 || true
          exit 1

      - name: Verify public-safe summary endpoint
        id: summary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error '${{ steps.endpoint.outputs.base }}/summary.json?days=30' -o /tmp/summary.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/summary.json'))
          assert isinstance(data.get('headline'), dict)
          for key in ('visitors','sessions','events'):
              assert key in data['headline']
          assert 'aggregate-public-safe' in data.get('privacy','')
          print(json.dumps(data, indent=2))
          PY

      - name: Verify browser CORS preflight
        id: cors
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/options.body -D /tmp/options.headers -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://amarbanerjee23.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type' \
            '${{ steps.endpoint.outputs.endpoint }}')
          test "$status" = '204'
          tr -d '\r' < /tmp/options.headers | grep -i '^Access-Control-Allow-Origin: https://amarbanerjee23.github.io$'
          tr -d '\r' < /tmp/options.headers | grep -i '^Access-Control-Allow-Methods:.*POST'

      - name: Verify collection path without writing a synthetic visit
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/collect.json -w '%{http_code}' -X POST \
            -H 'Origin: https://amarbanerjee23.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"event_type":"page_view","visitor_id":"00000000-0000-4000-8000-000000000001","session_id":"00000000-0000-4000-8000-000000000002","page":"/__analytics_health_check__","title":"Analytics health check","dry_run":true}' \
            '${{ steps.endpoint.outputs.endpoint }}')
          test "$status" = '202'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/collect.json'))
          assert data.get('ok') is True
          assert data.get('dry_run') is True
          assert data.get('database') is True
          print(json.dumps(data, indent=2))
          PY

      - name: Write repository-visible health report
        if: always()
        shell: python
        env:
          HEALTH_RESULT: ${{ steps.health.outcome }}
          SUMMARY_RESULT: ${{ steps.summary.outcome }}
          CORS_RESULT: ${{ steps.cors.outcome }}
          COLLECT_RESULT: ${{ steps.collect.outcome }}
          ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          checks={
              'worker_and_d1_health': os.getenv('HEALTH_RESULT','unknown'),
              'public_summary': os.getenv('SUMMARY_RESULT','unknown'),
              'browser_cors': os.getenv('CORS_RESULT','unknown'),
              'collection_dry_run': os.getenv('COLLECT_RESULT','unknown'),
          }
          overall='pass' if all(value=='success' for value in checks.values()) else 'fail'
          report={
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'endpoint': os.getenv('ENDPOINT',''),
              'overall': overall,
              'checks': checks,
              'note': 'Dry-run collection verifies CORS, request validation and D1 connectivity without adding a synthetic visitor event.'
          }
          Path('analytics').mkdir(exist_ok=True)
          Path('analytics/last-health-check.json').write_text(json.dumps(report, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(report, indent=2))

      - name: Commit health report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics/last-health-check.json
          if git diff --cached --quiet; then
            echo 'Health report unchanged.'
          else
            git commit -m 'Update live analytics health report [skip ci]'
            git push
          fi

      - name: Fail verification when any live check failed
        if: always()
        shell: bash
        run: |
          test '${{ steps.health.outcome }}' = 'success'
          test '${{ steps.summary.outcome }}' = 'success'
          test '${{ steps.cors.outcome }}' = 'success'
          test '${{ steps.collect.outcome }}' = 'success'
