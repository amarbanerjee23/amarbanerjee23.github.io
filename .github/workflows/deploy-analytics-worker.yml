name: Deploy privacy-aware analytics worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ANON_SALT: ${{ secrets.ANALYTICS_ANON_SALT }}
      EXPORT_TOKEN: ${{ secrets.ANALYTICS_EXPORT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytics-worker/package.json

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID ANON_SALT EXPORT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install

      - name: Build Wrangler config
        shell: bash
        run: |
          sed "s/__D1_DATABASE_ID__/${D1_DATABASE_ID}/g" wrangler.jsonc.template > wrangler.jsonc

      - name: Apply D1 schema
        run: npx wrangler d1 execute portfolio-analytics --remote --file=./schema.sql --config=./wrangler.jsonc --yes

      - name: Deploy collector
        run: npx wrangler deploy --config=./wrangler.jsonc

      - name: Configure pseudonymisation secret
        shell: bash
        run: printf '%s' "$ANON_SALT" | npx wrangler secret put ANON_SALT --config=./wrangler.jsonc

      - name: Configure protected export token
        shell: bash
        run: printf '%s' "$EXPORT_TOKEN" | npx wrangler secret put EXPORT_TOKEN --config=./wrangler.jsonc
