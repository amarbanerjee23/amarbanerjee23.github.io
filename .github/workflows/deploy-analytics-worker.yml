name: Bootstrap and deploy privacy-aware analytics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/analytics-worker/wrangler-output.ndjson
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytics-worker/package.json

      - name: Validate Cloudflare credentials without printing them
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare account identifier, not an email address." >&2
            exit 1
          fi
          echo "Cloudflare credential variables are present and the account ID format is valid."

      - name: Install Wrangler
        working-directory: analytics-worker
        run: npm install

      - name: Verify Cloudflare authentication
        working-directory: analytics-worker
        run: npx wrangler whoami

      - name: Deploy Worker, auto-provision D1, and initialise schema
        working-directory: analytics-worker
        run: npm run deploy

      - name: Resolve deployed workers.dev URL
        id: deployed
        shell: python
        run: |
          import json, os
          from pathlib import Path

          output = Path('analytics-worker/wrangler-output.ndjson')
          targets = []
          if output.exists():
              for line in output.read_text(encoding='utf-8').splitlines():
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if record.get('type') == 'deploy':
                      targets.extend(record.get('targets') or [])

          worker_url = next((item.rstrip('/') for item in reversed(targets) if item.startswith('https://')), '')
          if not worker_url:
              raise SystemExit('Could not resolve deployed Worker URL from Wrangler structured output.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'worker_url={worker_url}\n')
          print('Worker deployment URL resolved successfully.')

      - name: Activate website analytics endpoint automatically
        shell: python
        env:
          WORKER_URL: ${{ steps.deployed.outputs.worker_url }}
        run: |
          import os, re
          from pathlib import Path

          path = Path('analytics-config.js')
          text = path.read_text(encoding='utf-8')
          endpoint = os.environ['WORKER_URL'].rstrip('/') + '/collect'
          updated, count = re.subn(
              r"endpoint:\s*['\"][^'\"]*['\"]",
              f"endpoint: '{endpoint}'",
              text,
              count=1
          )
          if count != 1:
              raise SystemExit('Could not update analytics-config.js endpoint.')
          path.write_text(updated, encoding='utf-8')

          Path('analytics/worker-url.txt').write_text(os.environ['WORKER_URL'].rstrip('/') + '\n', encoding='utf-8')

      - name: Verify collector health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${{ steps.deployed.outputs.worker_url }}/health"

      - name: Commit automatic activation back to the website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f analytics-worker/wrangler-output.ndjson
          git add analytics-config.js analytics/worker-url.txt analytics-worker/wrangler.jsonc
          if git diff --cached --quiet; then
            echo "Analytics endpoint is already activated."
          else
            git commit -m "Activate privacy-aware website analytics [skip ci]"
            git push
          fi

      - name: Summary
        run: |
          echo "Analytics collector deployed and website endpoint activated."
          echo "The daily summary workflow now needs no analytics export secrets."
