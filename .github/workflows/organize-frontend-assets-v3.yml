name: One-shot frontend asset migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-frontend-asset-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate and verify
        shell: bash
        run: |
          set -euo pipefail
          {
            python scripts/migrate-frontend-assets.py
            python scripts/fix-moved-js-urls.py
            python scripts/check-static-assets.py
            python scripts/check-asset-layout.py
            while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          } 2>&1 | tee /tmp/one-shot-asset-migration.log

      - name: Record failure details
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/one-shot-asset-migration.log asset-migration-diagnostics.txt || echo 'No diagnostics captured.' > asset-migration-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-migration-diagnostics.txt
          git commit -m 'Record one-shot asset migration diagnostics' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit clean asset layout
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f asset-migration-diagnostics.txt .asset-migration-v3 .github/asset-migration-trigger.txt
          rm -f .github/workflows/organize-frontend-assets.yml .github/workflows/organize-frontend-assets-v2.yml .github/workflows/organize-frontend-assets-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No migration changes required.'; exit 0; fi
          git commit -m 'Organize frontend assets into structured directories'
          git pull --rebase origin main
          git push origin HEAD:main
