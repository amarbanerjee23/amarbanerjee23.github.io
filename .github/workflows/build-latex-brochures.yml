name: Build LaTeX brochures

on:
  push:
    branches: [main]
    paths:
      - "brochures-latex/**"
      - "headshot.png"
      - ".github/workflows/build-latex-brochures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latex-brochures-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            poppler-utils

      - name: Compile modern flat brochures
        shell: bash
        run: |
          set -euo pipefail
          cd brochures-latex
          brochures=(
            academic-innovation-partnership
            innovation-in-academia
            modern-day-professional
            technology-to-emotions
          )
          for brochure in "${brochures[@]}"; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error "$brochure.tex"
            pdfinfo "$brochure.pdf" | grep -q "Pages:[[:space:]]*4"
          done

      - name: Publish PDF and browser-download assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          brochures=(
            academic-innovation-partnership
            innovation-in-academia
            modern-day-professional
            technology-to-emotions
          )
          for brochure in "${brochures[@]}"; do
            cp "brochures-latex/$brochure.pdf" "downloads/$brochure.pdf"
            base64 -w 76 "brochures-latex/$brochure.pdf" > "downloads/$brochure.pdf.b64"
          done

      - name: Upload brochure artifact
        uses: actions/upload-artifact@v4
        with:
          name: latex-brochures
          path: |
            downloads/academic-innovation-partnership.pdf
            downloads/innovation-in-academia.pdf
            downloads/modern-day-professional.pdf
            downloads/technology-to-emotions.pdf
          if-no-files-found: error

      - name: Commit generated brochures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/*.pdf downloads/*.pdf.b64
          if git diff --cached --quiet; then
            echo "Generated brochures are already current."
            exit 0
          fi
          git commit -m "Build modern LaTeX brochure PDFs [skip ci]"
          git push
