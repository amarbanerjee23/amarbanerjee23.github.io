  <text x="110" y="110" fill="#28C4C7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="3">ACADEMIC INNOVATION PARTNERSHIP</text>
  <rect x="110" y="132" width="260" height="5" rx="2" fill="#28C4C7"/>
  <text x="110" y="235" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700">
    <tspan x="110" dy="0">What if your next differentiator</tspan><tspan x="110" dy="78">is a cohort that learns to find</tspan><tspan x="110" dy="78">important problems?</tspan>
  </text>
  <text x="110" y="520" fill="#D6E8EF" font-family="Arial,Helvetica,sans-serif" font-size="31">
    <tspan x="110" dy="0">A pilot-ready program connecting innovation thinking, research quality,</tspan><tspan x="110" dy="45">invention awareness and responsible AI with visible participant-owned outputs.</tspan>
  </text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="110" y="650" width="275" height="165" rx="22" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="135" y="700" fill="#F1C76A" font-size="23" font-weight="700">Innovation Thinking</text><text x="135" y="745" fill="#D6E8EF" font-size="19"><tspan x="135">Find and frame problems</tspan><tspan x="135" dy="28">worth solving.</tspan></text>
    <rect x="415" y="650" width="275" height="165" rx="22" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="440" y="700" fill="#F1C76A" font-size="23" font-weight="700">Research Excellence</text><text x="440" y="745" fill="#D6E8EF" font-size="19"><tspan x="440">Build stronger questions,</tspan><tspan x="440" dy="28">contribution and evidence.</tspan></text>
    <rect x="720" y="650" width="275" height="165" rx="22" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="745" y="700" fill="#F1C76A" font-size="23" font-weight="700">Patent Thinking</text><text x="745" y="745" fill="#D6E8EF" font-size="19"><tspan x="745">Recognise novelty, prior art</tspan><tspan x="745" dy="28">and invention potential.</tspan></text>
  </g>
  <rect x="1080" y="95" width="720" height="890" rx="34" fill="#ffffff" fill-opacity="0.96"/>
  <rect x="1080" y="95" width="720" height="18" rx="9" fill="#28C4C7"/>
  <text x="1140" y="175" fill="#031426" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="2">THE LOW-RISK START</text>
  <text x="1140" y="260" fill="#031426" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">
    <tspan x="1140">Choose one cohort.</tspan><tspan x="1140" dy="58">Define one measurable</tspan><tspan x="1140" dy="58">capability. Run the pilot.</tspan><tspan x="1140" dy="58">Review the evidence.</tspan>
  </text>
  <text x="1140" y="535" fill="#637581" font-family="Arial,Helvetica,sans-serif" font-size="24">
    <tspan x="1140">Leadership sees participant outputs, promising</tspan><tspan x="1140" dy="36">research or IP directions, owners and next milestones</tspan><tspan x="1140" dy="36">before deciding whether and how to continue.</tspan>
  </text>
  <line x1="1140" y1="680" x2="1740" y2="680" stroke="#DCE6EA" stroke-width="2"/>
