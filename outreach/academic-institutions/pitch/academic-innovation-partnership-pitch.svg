    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#031426" stop-opacity="0.98"/><stop offset="0.58" stop-color="#031426" stop-opacity="0.82"/><stop offset="1" stop-color="#031426" stop-opacity="0.28"/></linearGradient>
