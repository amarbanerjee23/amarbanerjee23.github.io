  <text x="110" y="1015" fill="#F1C76A" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">START WITH ONE COHORT  ·  amarbanerjee23@gmail.com  ·  linkedin.com/in/amarbanerjee23</text>
