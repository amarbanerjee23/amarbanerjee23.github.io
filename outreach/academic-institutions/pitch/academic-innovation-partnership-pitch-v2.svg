<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><linearGradient id="bg"><stop stop-color="#031426"/><stop offset="1" stop-color="#0d3550"/></linearGradient><clipPath id="p"><circle cx="1650" cy="820" r="85"/></clipPath></defs><rect width="1920" height="1080" fill="url(#bg)"/><g stroke="#28C4C7" opacity=".22" fill="none"><path d="M0 920L270 760L480 835L700 650L920 730L1100 540"/><path d="M760 0L970 210L1130 130L1320 320L1530 205L1920 500"/></g><g fill="#28C4C7" opacity=".5"><circle cx="270" cy="760" r="6"/><circle cx="480" cy="835" r="6"/><circle cx="700" cy="650" r="6"/><circle cx="970" cy="210" r="6"/><circle cx="1320" cy="320" r="6"/></g><text x="100" y="105" fill="#28C4C7" font-family="Arial" font-size="27" font-weight="700" letter-spacing="3">ACADEMIC INNOVATION PARTNERSHIP</text><text x="100" y="225" fill="white" font-family="Arial" font-size="62" font-weight="700"><tspan x="100">What if your next differentiator</tspan><tspan x="100" dy="72">is a cohort that learns to find</tspan><tspan x="100" dy="72">important problems?</tspan></text><text x="100" y="500" fill="#D6E8EF" font-family="Arial" font-size="27"><tspan x="100">A pilot-ready program connecting innovation thinking,</tspan><tspan x="100" dy="40">research quality, invention awareness and responsible AI</tspan><tspan x="100" dy="40">with visible participant-owned outputs.</tspan></text><g font-family="Arial"><rect x="100" y="665" width="265" height="145" rx="22" fill="white" opacity=".09"/><text x="125" y="715" fill="#F1C76A" font-size="22" font-weight="700">Innovation Thinking</text><text x="125" y="755" fill="#D6E8EF" font-size="18">Find problems worth solving.</text><rect x="390" y="665" width="265" height="145" rx="22" fill="white" opacity=".09"/><text x="415" y="715" fill="#F1C76A" font-size="22" font-weight="700">Research Excellence</text><text x="415" y="755" fill="#D6E8EF" font-size="18">Build stronger evidence.</text><rect x="680" y="665" width="265" height="145" rx="22" fill="white" opacity=".09"/><text x="705" y="715" fill="#F1C76A" font-size="22" font-weight="700">Patent Thinking</text><text x="705" y="755" fill="#D6E8EF" font-size="18">Recognise invention potential.</text></g><rect x="1030" y="80" width="790" height="920" rx="36" fill="#fff"/><rect x="1030" y="80" width="790" height="18" rx="9" fill="#28C4C7"/><text x="1090" y="165" fill="#031426" font-family="Arial" font-size="24" font-weight="700">THE LOW-RISK START</text><text x="1090" y="250" fill="#031426" font-family="Arial" font-size="45" font-weight="700"><tspan x="1090">Choose one cohort.</tspan><tspan x="1090" dy="55">Define one measurable</tspan><tspan x="1090" dy="55">capability. Run the pilot.</tspan><tspan x="1090" dy="55">Review the evidence.</tspan></text><text x="1090" y="520" fill="#637581" font-family="Arial" font-size="22"><tspan x="1090">Leadership sees participant outputs, promising</tspan><tspan x="1090" dy="34">research or IP directions, owners and next</tspan><tspan x="1090" dy="34">milestones before deciding how to continue.</tspan></text><line x1="1090" y1="655" x2="1760" y2="655" stroke="#DCE6EA"/><g font-family="Arial"><text x="1090" y="720" fill="#28C4C7" font-size="31" font-weight="700">30+</text><text x="1090" y="748" fill="#637581" font-size="16">publications</text><text x="1260" y="720" fill="#28C4C7" font-size="31" font-weight="700">25+</text><text x="1260" y="748" fill="#637581" font-size="16">filed patents</text><text x="1430" y="720" fill="#28C4C7" font-size="31" font-weight="700">7</text><text x="1430" y="748" fill="#637581" font-size="16">granted patents</text></g><image href="headshot.png" x="1550" y="715" width="200" height="230" clip-path="url(#p)" preserveAspectRatio="xMidYMid slice"/><text x="1090" y="845" fill="#031426" font-family="Arial" font-size="30" font-weight="700">Dr Amar Banerjee</text><text x="1090" y="885" fill="#28C4C7" font-family="Arial" font-size="16" font-weight="700"><tspan x="1090">INNOVATION LEADER · RESEARCHER</tspan><tspan x="1090" dy="25">INVENTOR · FACILITATOR</tspan></text><text x="100" y="1015" fill="#F1C76A" font-family="Arial" font-size="23" font-weight="700">START WITH ONE COHORT · amarbanerjee23@gmail.com · linkedin.com/in/amarbanerjee23</text></svg>